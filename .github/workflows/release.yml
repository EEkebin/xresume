name: Release

# Versions are dates: set __version__ in xresume.py (the UTC date, for example 2026.11.16), then push the tag
# v2026.11.16 to build the standalone executables and publish them as a release.
# The installers download from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use the oldest available runner so the result runs on older systems too.
          - { os: ubuntu-22.04, asset: xresume-linux-x64 }
          - { os: ubuntu-22.04-arm, asset: xresume-linux-arm64 }
          - { os: macos-latest, asset: xresume-macos-arm64 }
          - { os: windows-latest, asset: xresume-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check the tag matches the version in xresume.py
        shell: bash
        run: |
          version="$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("xresume.py", encoding="utf-8").read()).group(1))')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Run the tests
        run: python tests/test_xresume.py
      - name: Build
        shell: bash
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --onefile --console --name xresume --clean --noconfirm xresume.py
          built="dist/xresume"; [ -f "$built.exe" ] && built="$built.exe"
          "$built" --help
          mkdir out && cp "$built" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    # Publish whatever built, so one platform failing does not block the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "xresume $GITHUB_REF_NAME" --generate-notes
